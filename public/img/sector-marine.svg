<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Yatçılık ve marine ekipman">
  <defs>
    <linearGradient id="marineBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#marineBg)"/>

  <!-- gökyüzü çizgisi -->
  <path d="M30 168h340" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- yat gövdesi -->
  <g>
    <path d="M96 168c8 26 22 38 46 38h108c22 0 34-12 40-38z"
          fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M150 130h84l16 38H134z" fill="#0f172a" opacity=".08" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M170 130v-22h44v22" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M182 108v22M196 108v22" stroke="#0f172a" stroke-width="1.4" opacity=".5"/>
    <!-- anten -->
    <path d="M214 86v-16" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- kılavuz direği -->
    <path d="M96 168l-10-34" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- dalgalar -->
  <g stroke="#f97316" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M40 216c14-10 28-10 42 0s28 10 42 0 28-10 42 0 28 10 42 0 28-10 42 0"/>
    <path d="M66 236c12-8 24-8 36 0s24 8 36 0 24-8 36 0 24 8 36 0 24-8 36 0" opacity=".45"/>
  </g>

  <!-- can simidi (güvenlik ekipmanı) -->
  <g transform="translate(300 74)">
    <circle r="26" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <circle r="11" fill="none" stroke="#0f172a" stroke-width="2"/>
    <g fill="#f97316">
      <path d="M-26 0a26 26 0 0 1 13-22.5l6 10.5a13 13 0 0 0-12 12z"/>
      <path d="M26 0a26 26 0 0 1-13 22.5l-6-10.5a13 13 0 0 0 12-12z"/>
      <path d="M0-26a26 26 0 0 1 22.5 13l-10.5 6a13 13 0 0 0-12-12z"/>
      <path d="M0 26a26 26 0 0 1-22.5-13l10.5-6a13 13 0 0 0 12 12z"/>
    </g>
  </g>
</svg>