<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Vasıflı çelik çubuk">
  <defs>
    <linearGradient id="steelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#steelBg)"/>

  <!-- ana çubuk kesiti -->
  <g>
    <circle cx="176" cy="126" r="62" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <circle cx="176" cy="126" r="46" fill="none" stroke="#0f172a" stroke-width="1.8" opacity=".4"/>
    <circle cx="176" cy="126" r="29" fill="#0f172a" opacity=".08"/>
    <circle cx="176" cy="126" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <g stroke="#0f172a" stroke-width="1.2" opacity=".28">
      <path d="M114 126h124M176 64v124"/>
    </g>
  </g>

  <!-- yan kesitler -->
  <circle cx="308" cy="86" r="32" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <circle cx="308" cy="86" r="20" fill="none" stroke="#0f172a" stroke-width="1.5" opacity=".38"/>
  <circle cx="308" cy="86" r="6" fill="#0f172a" opacity=".12"/>

  <circle cx="322" cy="192" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <circle cx="322" cy="192" r="15" fill="none" stroke="#0f172a" stroke-width="1.5" opacity=".38"/>

  <!-- boyut oku -->
  <g stroke="#f97316" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M60 200h50"/>
  </g>
  <path d="M60 200l10-7v14zM110 200l-10-7v14z" fill="#f97316"/>

  <!-- kalibre işareti (üst çentik) -->
  <g stroke="#cbd5e1" stroke-width="2" stroke-linecap="round">
    <path d="M56 40h44M56 52h26M56 64h44M56 76h26"/>
  </g>

  <!-- denetim onayı -->
  <g transform="translate(56 214)">
    <circle r="17" fill="#0f172a"/>
    <path d="M-7 0l5 6 10-12" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
