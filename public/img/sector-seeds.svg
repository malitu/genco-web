    <path d="M297 202c4-5 11-6 17-3" stroke="#f97316" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="322" cy="66" rx="15" ry="10" transform="rotate(-12 322 66)" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M315 65c4-4 10-4 14-1" stroke="#f97316" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- izin onayı -->
