    <path d="M200 158c-26 0-40-15-40-36 24-2 40 13 40 36z" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M200 142c26-2 42-17 42-38-26 0-42 15-42 38z" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M200 200c-15 0-24 9-24 20" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M200 200c15 0 24 9 24 20" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- tohumlar -->
  <g>
    <ellipse cx="96" cy="82" rx="19" ry="12" transform="rotate(-24 96 82)" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M87 80c4-4 11-5 17-2" stroke="#f97316" stroke-width="2.5" fill="none" stroke-linecap="round"/>
