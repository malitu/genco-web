<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Vasıflı çelik çubuk">
  <defs>
    <linearGradient id="steelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#steelBg)"/>

  <!-- ölçü cetveli -->
  <g stroke="#cbd5e1" stroke-width="1">
    <path d="M40 40h34M40 47h22M40 54h34M40 61h22M40 68h34M40 75h22M40 82h34M40 89h22"/>
  </g>

  <!-- çubuk kesitleri (yığılmış demir) -->
  <g>
    <circle cx="150" cy="120" r="52" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="150" cy="120" r="38" fill="none" stroke="#0f172a" stroke-width="1.6" opacity=".45"/>
    <circle cx="150" cy="120" r="24" fill="#0f172a" opacity=".08"/>
    <circle cx="150" cy="120" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <!-- eş merkez çizgileri -->
    <g stroke="#0f172a" stroke-width="1" opacity=".3">
      <path d="M98 120h104M150 68v104"/>
    </g>
  </g>

  <g>
    <circle cx="262" cy="96" r="34" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="262" cy="96" r="22" fill="none" stroke="#0f172a" stroke-width="1.4" opacity=".4"/>
    <circle cx="262" cy="96" r="7" fill="#0f172a" opacity=".1"/>
  </g>

  <g>
    <circle cx="300" cy="184" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="300" cy="184" r="17" fill="none" stroke="#0f172a" stroke-width="1.4" opacity=".4"/>
  </g>

  <!-- boyut oku -->
  <g stroke="#f97316" stroke-width="2" stroke-linecap="round">
    <path d="M228 200h44"/>
    <path d="M228 200l9-6v12zM272 200l-9-6v12z" fill="#f97316" stroke="none"/>
  </g>
  <text x="250" y="222" font-family="ui-monospace,monospace" font-size="13" fill="#f97316" text-anchor="middle" font-weight="700">±0,05</text>

  <!-- alaşım rozeti -->
  <g>
    <rect x="40" y="120" width="72" height="30" rx="15" fill="#0f172a"/>
    <text x="76" y="140" font-family="ui-monospace,monospace" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">EN / ASTM</text>
